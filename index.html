<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan ke SIJAGAT...</title>
  <script>
    const isMobileHost = window.location.hostname.startsWith('mobile.');
    const destination = isMobileHost
      ? 'https://www.appsheet.com/newshortcut/2232a87e-c956-4ff9-b9ed-764443e033aa'
      : 'https://www.appsheet.com/start/2232a87e-c956-4ff9-b9ed-764443e033aa';
    window.location.replace(destination);
  </script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      line-height: 1.5;
    }
    p {
      margin: 0 0 1rem;
      font-size: 1rem;
    }
    a {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }
    a:focus-visible {
      outline: 2px solid #0284c7;
      outline-offset: 2px;
    }
    a:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <p>Sedang mengalihkan ke aplikasi SIJAGAT...</p>
    <a id="direct-link" href="https://www.appsheet.com/start/2232a87e-c956-4ff9-b9ed-764443e033aa">Buka Aplikasi Sekarang</a>
  </div>
  <script>
    const linkEl = document.getElementById('direct-link');
    if (window.location.hostname.startsWith('mobile.')) {
      linkEl.href = 'https://www.appsheet.com/newshortcut/2232a87e-c956-4ff9-b9ed-764443e033aa';
    }
  </script>
</body>
</html>
