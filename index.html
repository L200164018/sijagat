<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SIJAGAT</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* Support dynamic viewport height to prevent cutoff on mobile browser address bar changes */
    .app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Camera, geolocation, and microphone delegations are required for AppSheet photo upload and location capture -->
  <iframe
    class="app-frame"
    src="https://www.appsheet.com/start/2232a87e-c956-4ff9-b9ed-764443e033aa"
    title="Aplikasi SIJAGAT"
    allow="camera; geolocation; microphone; clipboard-write; fullscreen"
    loading="eager">
  </iframe>
</body>
</html>
